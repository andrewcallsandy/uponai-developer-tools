name: Publish reviewed packages
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [next, latest]
        default: next
        required: true
      resume:
        description: Resume a reviewed partial release only when existing artifact integrity matches
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - run: npm install --global npm@12.2.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run pack:release
      - run: node scripts/verify-live-contract.mjs
      - name: Publish with npm trusted publishing
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RESUME_RELEASE: ${{ inputs.resume }}
        run: node scripts/publish.mjs "$RELEASE_CHANNEL"
