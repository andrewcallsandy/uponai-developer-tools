name: Publish reviewed packages
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [next, latest]
        default: next
        required: true
      bootstrap:
        description: Use the temporary npm token for initial package creation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - run: npm install --global npm@12.2.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run pack:release
      - run: node scripts/verify-live-contract.mjs
      - name: Configure temporary bootstrap authentication
        if: inputs.bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          test -n "$NODE_AUTH_TOKEN"
          umask 077
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/uponai-npmrc"
      - name: Publish with temporary token
        if: inputs.bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/uponai-npmrc
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/publish.mjs "$RELEASE_CHANNEL"
      - name: Publish with npm trusted publishing
        if: ${{ !inputs.bootstrap }}
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/publish.mjs "$RELEASE_CHANNEL"
